# This file contains common MongoDB-related functions and tasks that are useful across multiple
# SQL Engines Evergreen projects. The functions in this config file depend on one or more of the
# following expansions:
#  - DRIVERS_TOOLS - path to the drivers-evergreen-tools directory (varies by repo)
#  - MONGODB_BINARIES - path to mongodb binaries (varies by repo)
#  - MONGO_ORCHESTRATION_HOME - path to mongo-orchestration (varies by repo)
#  - PROJECT_DIRECTORY - path to project (varies by repo)
#  - script_dir - path to the sql-engines-common-test-infra scripts (varies by repo)
#  - working_dir - the working directory in which a function should run
#
# The following expansions are optional:
#  - USE_MONGODB_RUNNER - set to "true" to use mongodb-runner instead of the deprecated
#    mongo-orchestration (SQL-3232); see the README
#  - DRIVERS_TOOLS_REF - the drivers-evergreen-tools revision to use instead of the pinned one

functions:
  # Starts a mongodb deployment using drivers-evergreen-tools. Use "stop mongo-orchestration" to stop it.
  #
  # Arguments:
  #   - TOPOLOGY - topology of deployment (often our projects just use "server")
  #   - MONGODB_VERSION - the version to use (can use aliases such as "latest")
  #   - ORCHESTRATION_FILE - (optional) the name of the config file to use, from
  #     $DRIVERS_TOOLS/.evergreen/orchestration/configs/<topology>s/
  "bootstrap mongo-orchestration":
    - command: subprocess.exec
      params:
        working_dir: ${working_dir}
        binary: bash
        args:
          - ${script_dir}/start_mongodb.sh
        include_expansions_in_env:
          - DRIVERS_TOOLS
          - MONGODB_BINARIES
          - TOPOLOGY
          - MONGODB_VERSION
          - ORCHESTRATION_FILE
          - USE_MONGODB_RUNNER

  # Fetches the drivers-evergreen-tools repo as a resource
  "prepare resources":
    - command: subprocess.exec
      params:
        working_dir: ${working_dir}
        include_expansions_in_env:
          - DRIVERS_TOOLS
          - DRIVERS_TOOLS_REF
        binary: bash
        args:
          - ${script_dir}/fetch_drivers_tools.sh

  # Stops a mongodb deployment started via "bootstrap mongo-orchestration". With USE_MONGODB_RUNNER
  # this is safe to use in a `post` block, even in tasks that did not start a deployment.
  "stop mongo-orchestration":
    - command: subprocess.exec
      params:
        working_dir: ${working_dir}
        binary: bash
        include_expansions_in_env:
          - DRIVERS_TOOLS
          - MONGO_ORCHESTRATION_HOME
          - PROJECT_DIRECTORY
          - USE_MONGODB_RUNNER
        args:
          - ${script_dir}/stop_mongodb.sh

  # Checks that the deployment started via "bootstrap mongo-orchestration" is running or stopped.
  #
  # Arguments:
  #   - state - "running" or "stopped"
  "check mongodb deployment":
    - command: subprocess.exec
      type: test
      params:
        working_dir: ${working_dir}
        binary: bash
        include_expansions_in_env:
          - DRIVERS_TOOLS
          - MONGODB_VERSION
        args:
          - ${script_dir}/check_mongodb_deployment.sh
          - ${state}

  "generate sql-engines github token":
    command: github.generate_token
    params:
      owner: 10gen
      repo: mongohouse
      expansion_name: github_token

  "update orchestrator mongod port":
    - command: subprocess.exec
      params:
        binary: bash
        include_expansions_in_env:
          - DRIVERS_TOOLS
        working_dir: ${working_dir}
        args:
          - ${script_dir}/update_orchestrator_mongod_port.sh
